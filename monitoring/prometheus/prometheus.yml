global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "forge_backend"
    metrics_path: "/metrics"
    static_configs:
      # The backend is a Compose service, so use the internal DNS name.
      - targets: ["backend:8000"]
        labels:
          service: "forge-api"
          env: "development"
