name: forge-infrastructure

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-forge_ai}
    volumes:
      - forge_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - forge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - forge_qdrant_data:/qdrant/storage
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: forge-backend:dev
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-forge_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DEBUG: ${DEBUG:-true}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      SERVICE_NAME: ${SERVICE_NAME:-forge-ai}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker.py:/app/worker.py
      - ./backend/discord_bot.py:/app/discord_bot.py
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: forge-backend:dev
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-forge_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      SERVICE_NAME: ${SERVICE_NAME:-forge-ai-worker}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: ["python", "worker.py"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker.py:/app/worker.py
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  discord:
    image: forge-backend:dev
    restart: unless-stopped
    profiles: ["discord"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-forge_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      SERVICE_NAME: ${SERVICE_NAME:-forge-ai-discord}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: ["python", "discord_bot.py"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/discord_bot.py:/app/discord_bot.py
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - forge_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      FORGE_GRAFANA_DASHBOARDS: /var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - forge_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

volumes:
  forge_mongodb_data:
  forge_redis_data:
  forge_qdrant_data:
  forge_prometheus_data:
  forge_grafana_data:
